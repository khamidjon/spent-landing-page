<style>
:root{
  color-scheme:light dark;
  --bg:#F7F7F5; --surface:#fff; --muted:#EFEFEE;
  --txt:#1C1C1E; --mut:#6B6B70; --dim:#9A9AA0;
  --accent:#E8434B; --accent-soft:#FCE8E9; --line:#E6E6E4;
  --shadow:0 18px 44px -22px rgba(28,28,30,.34);
  --font:"Poppins",-apple-system,"SF Pro Rounded","SF Pro Display",BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E0E10; --surface:#1A1A1D; --muted:#26262A;
    --txt:#F5F5F4; --mut:#9A9AA0; --dim:#6E6E76;
    --accent:#FF5A61; --accent-soft:#2A1A1C; --line:#26262A;
    --shadow:0 18px 44px -20px rgba(0,0,0,.8);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--txt); font-family:var(--font);
  -webkit-font-smoothing:antialiased; text-wrap:pretty; overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
[hidden]{display:none !important}
/* margin-inline, not `margin:0 auto` — the shorthand's margin-top:0 outranks
   the `section` rule below (class beats element) and silently flattened the
   spacing between every section. */
.wrap{width:100%; max-width:1080px; margin-inline:auto; padding:0 20px}
.eyebrow{font:700 12px/1 var(--font); letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); margin-bottom:14px}
h2{font:800 clamp(26px,4.2vw,42px)/1.14 var(--font); letter-spacing:-.03em}
.lede{margin-top:12px; max-width:56ch; color:var(--mut);
  font:400 clamp(14px,1.5vw,17px)/1.55 var(--font)}
section{margin-top:clamp(64px,12vh,132px)}

/* Sections fade up as they arrive — the app's own motion-led polish, and the
   only decoration on an otherwise flat, matte page. */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.r1,.r2,.r3,.r4,.r5{animation:rise .55s cubic-bezier(.22,.8,.3,1) both}
.r2{animation-delay:.06s}.r3{animation-delay:.12s}.r4{animation-delay:.18s}.r5{animation-delay:.26s}
.reveal{opacity:0; transform:translateY(18px);
  transition:opacity .6s cubic-bezier(.22,.8,.3,1), transform .6s cubic-bezier(.22,.8,.3,1)}
.reveal.in{opacity:1; transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .r1,.r2,.r3,.r4,.r5{animation:none}
  .reveal{opacity:1;transform:none;transition:none}
  .iab-arrow{animation:none !important}
}

/* ── header ─────────────────────────────────────────────────────── */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-top:22px}
.brand{display:flex; align-items:center; gap:11px; min-width:0}
.brand .icon{width:44px; height:44px; flex:none; border-radius:23%; overflow:hidden;
  background:var(--surface); box-shadow:0 0 0 1px var(--line)}
.brand .icon img{width:100%;height:100%;object-fit:cover}
.brand .word{font:800 25px/1 var(--font); letter-spacing:-.035em; white-space:nowrap}
.brand .word i{font-style:normal; color:var(--accent)}
.top-right{display:flex; align-items:center; gap:14px}
.socials{display:flex; align-items:center; gap:6px}
.socials a{display:grid; place-items:center; width:34px; height:34px; border-radius:11px;
  color:var(--mut); transition:color .15s ease, background .15s ease}
.socials a:hover{color:var(--txt); background:var(--muted)}
.socials svg{width:19px;height:19px}
.langs{display:flex; gap:2px; padding:3px; border-radius:99px; background:var(--muted)}
.langs button{all:unset; cursor:pointer; padding:5px 10px; border-radius:99px;
  font:700 11px/1 var(--font); letter-spacing:.04em; color:var(--mut)}
.langs button.on{color:#fff; background:var(--accent)}
.langs button:not(.on):hover{color:var(--txt)}
@media (max-width:560px){ .top .socials{display:none} }

/* ── hero ───────────────────────────────────────────────────────── */
.hero{text-align:center; margin-top:clamp(30px,7vh,74px)}
h1{font:800 clamp(32px,7.2vw,60px)/1.1 var(--font); letter-spacing:-.04em;
  max-width:15ch; margin:0 auto}
h1 mark{background:none; color:var(--accent)}
/* The accented phrase and its trailing punctuation stay on one line — a break
   inside them ("…in 3" / "seconds.") reads as a typo rather than a headline. */
h1 .h1-end{white-space:nowrap}
.sub{margin:clamp(14px,2.4vh,24px) auto 0; max-width:48ch; color:var(--mut);
  font:400 clamp(14px,1.6vw,18px)/1.55 var(--font)}

/* ── store badge ────────────────────────────────────────────────── */
.badges{display:flex; justify-content:center; flex-wrap:wrap;
  gap:12px; margin-top:clamp(18px,3vh,30px)}
.badge{display:flex; align-items:center; gap:11px;
  height:clamp(52px,6.4vh,60px); padding:0 clamp(18px,2vw,24px);
  background:var(--txt); color:var(--bg); border-radius:99px;
  transition:transform .12s ease, opacity .15s ease;
  -webkit-tap-highlight-color:transparent}
.badge:hover{opacity:.88}
.badge:active{transform:scale(.98)}
.badge svg{width:clamp(21px,2.4vw,25px);height:auto;flex:none}
.badge .lbl{display:flex; flex-direction:column; line-height:1; text-align:left}
.badge .lbl small{font:500 clamp(8.5px,.95vw,10.5px)/1 var(--font);
  letter-spacing:.03em; text-transform:uppercase; opacity:.78}
.badge .lbl b{font:700 clamp(16px,1.9vw,20px)/1.15 var(--font); letter-spacing:-.02em; margin-top:3px}
.trial{margin-top:12px; color:var(--dim); font:500 12.5px/1.4 var(--font)}

/* ── Instagram in-app-browser helper ────────────────────────────── */
.iab{display:grid; grid-template-columns:24px 1fr; gap:11px; align-items:center;
  width:100%; max-width:430px; margin:14px auto 0; text-align:left;
  padding:11px 15px; border-radius:16px; background:var(--muted);
  transition:background .35s ease, box-shadow .35s ease}
.iab.armed{background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent)}
.iab-arrow{width:24px;height:24px;color:var(--mut);animation:nudge 2.8s ease-in-out infinite}
.iab.armed .iab-arrow{color:var(--accent)}
@keyframes nudge{0%,100%{transform:translate(0,0)}45%{transform:translate(2px,-3px)}}
.iab-title{font:700 13px/1.3 var(--font); display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.iab-body{margin-top:2px; font:400 11.5px/1.35 var(--font); color:var(--mut)}
.dots{display:inline-block; padding:0 6px; border-radius:6px; background:var(--surface);
  box-shadow:0 0 0 1px var(--line); font:800 11px/16px var(--font); letter-spacing:1px}

/* ── hero phone row ─────────────────────────────────────────────── */
.shots{position:relative; margin-top:clamp(26px,5vh,56px);
  display:flex; justify-content:center; align-items:flex-start; gap:clamp(14px,2vw,30px)}
/* Capped well under the capture's own point size — these are 3x grabs, so the
   ceiling is a third of 1030px. */
.shots img{width:clamp(122px,13.2vw,158px); height:auto; flex:none;
  filter:drop-shadow(0 20px 34px rgba(28,28,30,.22))}
@media (prefers-color-scheme:dark){
  .shots img{filter:drop-shadow(0 20px 34px rgba(0,0,0,.6))}
}
/* On phones the row deliberately bleeds past both edges so the middle screen
   stays big and legible; side fades keep the cut soft. */
@media (max-width:760px){
  .shots{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);
  }
}

/* ── ratings + reviews (hidden until the thresholds in CONFIG) ──── */
.ratings{display:flex; justify-content:center; align-items:center; gap:14px}
.ratings .r-badge{width:40px;height:40px;flex:none;color:var(--txt);opacity:.9}
.ratings .r-col{text-align:left}
.ratings .r-score{font:800 21px/1 var(--font)}
.ratings .r-score span{color:var(--mut); font-weight:600}
.rstars{display:flex; gap:2px; margin-top:5px}
.rstars svg{width:15px;height:15px;fill:#FFC83D}
.ratings .r-cap{display:block; margin-top:5px; font:500 12px/1 var(--font); color:var(--mut);
  text-decoration:underline; text-underline-offset:3px}
.reviews{display:grid; grid-template-columns:1fr 1fr; gap:clamp(14px,1.8vw,22px)}
.review{border-radius:20px; background:var(--surface); box-shadow:var(--shadow);
  padding:clamp(18px,2.4vw,26px); display:flex; flex-direction:column; gap:11px}
.review .head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.review .head b{font:700 clamp(15px,1.7vw,18px)/1.2 var(--font); letter-spacing:-.01em}
.review .stars5{display:flex; gap:2px; flex:none}
.review .stars5 svg{width:14px;height:14px;fill:#FFC83D}
.review p{color:var(--mut); font:400 clamp(13.5px,1.4vw,15px)/1.55 var(--font); flex:1}
.review .who{align-self:flex-end; font:500 12.5px/1 var(--font); color:var(--dim)}
@media (max-width:760px){ .reviews{grid-template-columns:1fr} }

/* ── three ways to capture ──────────────────────────────────────── */
.ways{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,1.8vw,22px);
  margin-top:clamp(26px,4vh,44px)}
.way{border-radius:22px; background:var(--surface); box-shadow:var(--shadow);
  padding:clamp(22px,2.6vw,30px)}
.way .ic{width:46px; height:46px; border-radius:15px; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent)}
.way .ic svg{width:23px;height:23px}
.way b{display:block; margin-top:16px;
  font:700 clamp(17px,1.9vw,21px)/1.2 var(--font); letter-spacing:-.02em}
.way p{margin-top:8px; color:var(--mut); font:400 clamp(13.5px,1.4vw,15px)/1.55 var(--font)}
.way .said{display:inline-block; margin-top:12px; padding:7px 13px; border-radius:99px;
  background:var(--muted); color:var(--txt); font:500 13px/1.3 var(--font)}
@media (max-width:820px){ .ways{grid-template-columns:1fr} }

/* ── how it works ───────────────────────────────────────────────── */
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(18px,2.4vw,32px);
  margin-top:clamp(26px,4vh,44px); counter-reset:step}
.step{counter-increment:step; position:relative; padding-top:16px}
.step::before{content:counter(step); display:grid; place-items:center;
  width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff;
  font:700 15px/1 var(--font)}
.step b{display:block; margin-top:16px; font:700 clamp(16px,1.8vw,19px)/1.25 var(--font);
  letter-spacing:-.02em}
.step p{margin-top:7px; color:var(--mut); font:400 clamp(13.5px,1.4vw,15px)/1.55 var(--font)}
@media (max-width:820px){ .steps{grid-template-columns:1fr; gap:22px} }

/* ── showcase ───────────────────────────────────────────────────── */
.showcase{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(20px,3vw,40px);
  margin-top:clamp(30px,5vh,54px)}
.show{text-align:center}
.show img{width:100%; max-width:264px; height:auto; margin:0 auto;
  filter:drop-shadow(0 20px 34px rgba(28,28,30,.2))}
@media (prefers-color-scheme:dark){
  .show img{filter:drop-shadow(0 20px 34px rgba(0,0,0,.6))}
}
.show b{display:block; margin-top:22px; font:700 clamp(16px,1.8vw,19px)/1.25 var(--font);
  letter-spacing:-.02em}
.show p{margin-top:7px; color:var(--mut); font:400 clamp(13.5px,1.4vw,15px)/1.55 var(--font)}
@media (max-width:820px){
  .showcase{grid-template-columns:1fr; gap:44px}
  .show img{max-width:216px}
}

/* ── feature grid ───────────────────────────────────────────────── */
.fgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(12px,1.5vw,18px);
  margin-top:clamp(26px,4vh,44px)}
.fcard{border-radius:18px; background:var(--surface); box-shadow:var(--shadow);
  padding:clamp(18px,2vw,24px)}
.fcard svg{width:23px;height:23px;color:var(--accent)}
.fcard b{display:block; margin-top:13px;
  font:700 clamp(14.5px,1.5vw,16.5px)/1.25 var(--font); letter-spacing:-.015em}
.fcard p{margin-top:6px; color:var(--mut); font:400 clamp(12.5px,1.3vw,13.5px)/1.5 var(--font)}
@media (max-width:940px){ .fgrid{grid-template-columns:1fr 1fr} }
@media (max-width:480px){ .fgrid{grid-template-columns:1fr} }

/* ── privacy band ───────────────────────────────────────────────── */
.privacy{border-radius:28px; background:var(--surface); box-shadow:var(--shadow);
  padding:clamp(30px,4.5vw,58px); text-align:center}
.privacy .ic{width:52px; height:52px; margin:0 auto; border-radius:17px; display:grid;
  place-items:center; background:var(--accent-soft); color:var(--accent)}
.privacy .ic svg{width:26px;height:26px}
.privacy h2{margin-top:20px}
.privacy .lede{margin-left:auto; margin-right:auto}
.pills{display:flex; justify-content:center; flex-wrap:wrap; gap:9px; margin-top:24px}
.pills span{padding:8px 15px; border-radius:99px; background:var(--muted);
  color:var(--mut); font:500 13px/1.3 var(--font)}

/* ── plans ──────────────────────────────────────────────────────── */
.plans{display:grid; grid-template-columns:1fr 1fr; gap:clamp(14px,1.8vw,22px);
  margin-top:clamp(26px,4vh,44px)}
.plan{border-radius:22px; background:var(--surface); box-shadow:var(--shadow);
  padding:clamp(24px,2.8vw,34px)}
.plan b{font:700 clamp(18px,2vw,22px)/1.2 var(--font); letter-spacing:-.02em}
.plan .who{margin-top:6px; color:var(--mut); font:400 14px/1.5 var(--font)}
.plan ul{list-style:none; margin-top:18px; display:flex; flex-direction:column; gap:10px}
.plan li{display:grid; grid-template-columns:19px 1fr; gap:10px; align-items:start;
  color:var(--mut); font:400 14px/1.5 var(--font)}
.plan li svg{width:19px;height:19px;color:var(--accent);margin-top:2px}
.plan .note{margin-top:20px; padding-top:18px; border-top:1px solid var(--line);
  color:var(--dim); font:500 12.5px/1.5 var(--font)}
@media (max-width:820px){ .plans{grid-template-columns:1fr} }

/* ── FAQ ────────────────────────────────────────────────────────── */
.faq{margin-top:clamp(26px,4vh,40px); max-width:800px}
.faq details{border-radius:16px; background:var(--surface); box-shadow:var(--shadow);
  padding:4px 20px; margin-bottom:10px}
.faq summary{cursor:pointer; list-style:none; padding:17px 30px 17px 0; position:relative;
  font:600 clamp(14.5px,1.5vw,16.5px)/1.4 var(--font); letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:''; position:absolute; right:4px; top:50%; width:9px; height:9px;
  border-right:2px solid var(--mut); border-bottom:2px solid var(--mut);
  transform:translateY(-70%) rotate(45deg); transition:transform .2s ease}
.faq details[open] summary::after{transform:translateY(-30%) rotate(225deg)}
.faq details p{padding:0 0 18px; color:var(--mut);
  font:400 clamp(13.5px,1.4vw,15px)/1.6 var(--font)}

/* ── bottom CTA ─────────────────────────────────────────────────── */
.cta2{text-align:center}
.cta2 p{margin:12px auto 0; max-width:46ch; color:var(--mut);
  font:400 clamp(14px,1.5vw,17px)/1.55 var(--font)}

/* ── footer ─────────────────────────────────────────────────────── */
.foot{margin-top:clamp(64px,12vh,120px); border-top:1px solid var(--line);
  padding:26px 0 calc(28px + env(safe-area-inset-bottom))}
.foot .row{display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap}
.foot .left{display:flex; align-items:center; gap:10px}
.foot .left .icon{width:30px;height:30px;border-radius:24%;overflow:hidden}
.foot .left .icon img{width:100%;height:100%;object-fit:cover}
.foot .left b{font:800 15px/1 var(--font); letter-spacing:-.03em}
.foot .links{display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  font:500 12.5px/1 var(--font); color:var(--mut)}
.foot .links a:hover{color:var(--txt)}
.foot .copy{margin-top:16px; font:400 11.5px/1.5 var(--font); color:var(--dim)}

/* ── short viewports (Instagram's in-app browser is ~560pt tall) ────
   Tighten everything above the badge so the store button and the escape-hatch
   helper are on screen without scrolling. */
@media (max-height:680px){
  .top{padding-top:14px}
  .brand .icon{width:38px;height:38px}
  .brand .word{font-size:22px}
  .hero{margin-top:18px}
  h1{font-size:clamp(26px,7vw,34px)}
  .sub{margin-top:11px; font-size:13px; max-width:38ch}
  .badges{margin-top:15px}
  .trial{margin-top:9px}
  .shots{margin-top:20px}
}
@media (max-height:600px){ .sub{display:none} }
@media (max-height:500px){ .iab-body{display:none} }

/* ?frame=1 — dev aid: clamp to the 375×560 Instagram viewport */
body.framed{padding:20px;display:flex;justify-content:center;align-items:flex-start;
  background:#101014}
body.framed .site{width:375px;height:560px;overflow-y:auto;outline:1px dashed #2C2C2E;
  background:var(--bg)}
</style>

/* ══ environment ════════════════════════════════════════════════════ */
var q = new URLSearchParams(location.search);
var h = new URLSearchParams(location.hash.replace(/^#/, ''));
function param(k){ return q.get(k) || h.get(k) || ''; }

var ua = navigator.userAgent || '';
var isInsta  = /Instagram/i.test(ua);
var isTikTok = /BytedanceWebview|TikTok|musical_ly|Bytedance/i.test(ua);
var isMeta   = /FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(ua);
var isAppish = /Line|WhatsApp|Snapchat|Telegram|GSA/i.test(ua);
var isIAB    = isInsta || isTikTok || isMeta || isAppish;
var isIOS   = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var isAndro = /Android/i.test(ua);

var os    = param('os')    || (isIOS ? 'ios' : isAndro ? 'android' : 'other');
var inIAB = param('state') ? param('state') === 'iab' : isIAB;
var stored = '';
try { stored = localStorage.getItem('spent_lang') || ''; } catch(e){}
var browserLang = (navigator.language || 'en').slice(0,2).toLowerCase();
var pinned = param('lang') || stored;   // explicit choice — geo must never override it
var lang = (pinned || browserLang || 'en').slice(0,2).toLowerCase();
if (!STR[lang]) lang = 'en';
if (param('frame') === '1') document.body.className = 'framed';

var T = STR[lang], C = CONFIG;

/* ══ traffic source ═════════════════════════════════════════════════
   `?src=` wins; otherwise infer from the referrer so untagged links still
   attribute. Allowlisted — a raw query param must never reach a store URL. */
var REF_MAP = [
  [/instagram\./i, 'ig'], [/threads\./i, 'threads'], [/tiktok\./i, 'tiktok'],
  [/youtube\.|youtu\.be/i, 'yt'], [/t\.me|telegram\./i, 'tg']
];
function clean(v){ v = (v || '').toLowerCase(); return C.srcPattern.test(v) ? v : ''; }

/* Two levels, so channels AND individual creatives can be compared:
     ?src=   WHERE it came from  — ig, tiktok, yt, tg, meta_traffic…
     ?post=  WHICH creative      — reel_receipt, story_0815…  (?ad= is an alias)
   e.g. /?src=ig&post=reel_receipt

   Query params only, deliberately: a path-based /go/<src>/<post> scheme was
   tried on CalFit and rejected. Cloudflare Web Analytics has no query-string
   dimension, so every link here collapses into one "/" row — per-creative
   numbers come from App Store Connect, which is where installs live anyway. */
var src  = clean(param('src')) || (function(){
  var ref = document.referrer || '';
  for (var i = 0; i < REF_MAP.length; i++) if (REF_MAP[i][0].test(ref)) return REF_MAP[i][1];
  return 'direct';
})();
var post = clean(param('post')) || clean(param('ad'));

/* Apple gives exactly one free-form field (ct), so the two levels are PACKED
   into it rather than blind-sliced: the channel is kept whole (it is the
   dimension you always want) and the creative takes whatever room is left, cut
   back to an underscore. A long name then degrades into a shorter readable one
   instead of a mangled fragment like `ig_reel_rece` — which would otherwise
   show up as its own campaign row in App Store Connect and never reconcile
   with anything.

   30, not 40: Apple documents the campaign token as "up to 30 alphanumeric
   characters and spaces" plus a punctuation set that includes `_`.
   https://developer.apple.com/help/app-store-connect-analytics/acquisition/campaign-links/ */
var CT_MAX = 30;
function packCt(channel, creative){
  channel = channel.slice(0, CT_MAX);
  if (!creative) return channel;
  var room = CT_MAX - channel.length - 1;          // 1 for the separator
  if (room < 1) return channel;                    // no space for a creative
  if (creative.length <= room) return channel + '_' + creative;
  var cut = creative.slice(0, room);
  var sep = cut.lastIndexOf('_');
  if (sep > 0) cut = cut.slice(0, sep);            // land on a word boundary
  return channel + '_' + cut;
}
var ct = packCt(src, post);

/* Every URL here carries its tracking, including the app-scheme one. That is
   the whole point: `handoffUrl()` prefers a scheme over https on most taps, so
   a scheme URL without the campaign attached is a tap whose attribution is
   thrown away at the last hop — invisible, because the visitor still lands in
   the right place. */
var appleParams = (C.appleProviderToken ? 'pt=' + encodeURIComponent(C.appleProviderToken) + '&' : '') +
  'ct=' + ct + '&mt=8';

var STORE = {
  ios: {
    url: 'https://apps.apple.com/app/id' + C.appleId + '?' + appleParams,
    schemeUrl: 'itms-apps://apps.apple.com/app/id' + C.appleId + '?' + appleParams
  }
};

  return '<button data-l="' + l + '"' + (l === lang ? ' class="on"' : '') + '>' + LANG_LABEL[l] + '</button>';

  var l = b.getAttribute('data-l'); if (l === lang) return;
  try { localStorage.setItem('spent_lang', l); } catch(err){}
  q.set('lang', l);
  location.replace(location.pathname + '?' + q.toString() + location.hash);
});

/* ══ social proof ═══════════════════════════════════════════════════
   Real App Store numbers only, and only once there are enough of them to help.
   Below the thresholds both sections stay hidden and the page sells the
   product instead — "5.0 from 1 rating" is a worse signal than silence. */
var STAR = '<svg viewBox="0 0 12 12"><path d="M6 .6l1.7 3.45 3.8.55-2.75 2.68.65 3.79L6 9.28 2.6 11.07l.65-3.79L.5 4.6l3.8-.55z"/></svg>';
function stars5(){ return STAR + STAR + STAR + STAR + STAR; }
function renderReviews(){

  rEl.hidden = !showRating;

    rEl.innerHTML =
      '<svg class="r-badge" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<path d="M17.05 12.5c0-2 1.05-3.3 2.35-4.1a4.7 4.7 0 0 0-3.7-2c-1.55-.15-3.2.9-3.8.9-.65 0-2-.85-3.3-.85C6.05 6.5 4 8.4 4 12.2c0 1.15.2 2.35.6 3.6.55 1.65 2.5 5.7 4.55 5.6 1.05-.05 1.8-.75 3.15-.75 1.3 0 2 .75 3.15.75 2.05-.05 3.85-3.7 4.35-5.35-2.7-1.3-2.75-3.5-2.75-3.55zM14.6 5.1c1.15-1.4 1.05-2.65 1-3.1-1.05.05-2.25.7-2.95 1.5-.75.85-1.15 1.9-1.05 3.05 1.15.1 2.2-.5 3-1.45z"/></svg>' +
      '<span class="r-col"><span class="r-score">' + C.rating.score + '<span>/5</span></span>' +
      '<span class="rstars">' + stars5() + '</span>' +
      '<a class="r-cap" href="' + STORE.ios.url + '" rel="noopener">' + C.rating.count + ' ' + T.ratingCap + '</a></span>';
  }

  var vEl = document.getElementById('reviews');
  var list = T.reviews || [];
  vEl.hidden = list.length < C.minReviews;
  if (!vEl.hidden){
    vEl.innerHTML = list.map(function(r){
      return '<article class="review"><div class="head"><b>' + r.t + '</b>' +
        '<span class="stars5">' + stars5() + '</span></div>' +
        '<p>' + r.b + '</p>' +
        '<span class="who">' + r.f + ' ' + r.n + '</span></article>';
    }).join('');
  }
}

/* ══ sections ═══════════════════════════════════════════════════════ */
function renderWays(){
  document.getElementById('ways').innerHTML = T.ways.map(function(w){
    return '<div class="way"><span class="ic" aria-hidden="true">' + ICON[w.i] + '</span>' +
      '<b>' + w.t + '</b><p>' + w.b + '</p>' +
      (w.s ? '<span class="said">' + w.s + '</span>' : '') + '</div>';
  }).join('');
}
function renderSteps(){
  document.getElementById('steps').innerHTML = T.steps.map(function(s){
    return '<div class="step"><b>' + s.t + '</b><p>' + s.b + '</p></div>';
  }).join('');
}
function renderShowcase(){
  document.getElementById('showcase').innerHTML = T.shows.map(function(s){
    return '<figure class="show"><img src="' + s.img + '" width="560" height="1181" alt="" loading="lazy" decoding="async">' +
      '<figcaption><b>' + s.t + '</b><p>' + s.b + '</p></figcaption></figure>';
  }).join('');
}
function renderFeatures(){
  document.getElementById('fgrid').innerHTML = T.features.map(function(f){
    return '<div class="fcard">' + (ICON[f.i] || '') + '<b>' + f.t + '</b><p>' + f.b + '</p></div>';
  }).join('');
}
function renderPrivacy(){
  document.getElementById('priv-pills').innerHTML =
    T.privPills.map(function(p){ return '<span>' + p + '</span>'; }).join('');
}
function renderPlans(){
  document.getElementById('plans').innerHTML = T.plans.map(function(p){
    return '<div class="plan"><b>' + p.t + '</b><p class="who">' + p.w + '</p><ul>' +
      p.f.map(function(f){ return '<li>' + ICON.check + '<span>' + f + '</span></li>'; }).join('') +
      '</ul><p class="note">' + T.planNote + '</p></div>';
  }).join('');
}
function renderFaq(){
  document.getElementById('faq').innerHTML = T.faq.map(function(f, i){
    return '<details' + (i === 0 ? ' open' : '') + '><summary>' + f.q + '</summary><p>' + f.a + '</p></details>';
  }).join('');
}

/* hero phone row — eager, not lazy. The row sits at the fold on a desktop
   viewport, where lazy loading just buys a visible pop-in on the first paint;
   the five webps together are lighter than a single stock hero photo. Only the
   far-below-the-fold showcase shots defer. */
var mid = Math.floor(C.screens.length / 2);
document.getElementById('shots').innerHTML = C.screens.map(function(s, i){
  return '<img src="' + s + '" width="560" height="1181" alt="" decoding="async"' +
         (i === mid ? ' fetchpriority="high"' : '') + '>';
}).join('');

/* ══ store badge + smart tap ════════════════════════════════════════
   The badge tries the itms-apps:// scheme (which hands straight to the App
   Store app, including out of most in-app browsers) and falls back to the
   plain https store link if nothing took over. */
var APPLE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'
  + '<path d="M17.05 12.5c0-2 1.05-3.3 2.35-4.1a4.7 4.7 0 0 0-3.7-2c-1.55-.15-3.2.9-3.8.9-.65 0-2-.85-3.3-.85C6.05 6.5 4 8.4 4 12.2c0 1.15.2 2.35.6 3.6.55 1.65 2.5 5.7 4.55 5.6 1.05-.05 1.8-.75 3.15-.75 1.3 0 2 .75 3.15.75 2.05-.05 3.85-3.7 4.35-5.35-2.7-1.3-2.75-3.5-2.75-3.55zM14.6 5.1c1.15-1.4 1.05-2.65 1-3.1-1.05.05-2.25.7-2.95 1.5-.75.85-1.15 1.9-1.05 3.05 1.15.1 2.2-.5 3-1.45z"/></svg>';

/* Best hand-off for this environment.
   Instagram exposes `instagram://extbrowser`, which asks Instagram itself to
   reopen a URL in the real browser — the one reliable way out of its webview,
   and far better than hoping a plain store link survives. Everywhere else the
   plain app scheme is enough. Note that a plain https navigation is never
   attempted from inside a webview: it would just load the store page trapped
   in that same webview. */
function handoffUrl(){
  if (isInsta) return 'instagram://extbrowser?url=' + encodeURIComponent(STORE.ios.url);
  return STORE.ios.schemeUrl;
}
function badgeHTML(){
  return '<a class="badge" rel="noopener" href="' + STORE.ios.url + '">' + APPLE_SVG +
    '<span class="lbl"><small>' + T.badgeApple + '</small><b>' + T.storeIos + '</b></span></a>';
}
function renderBadges(){
  ['badges-hero','badges-bottom'].forEach(function(id){
    document.getElementById(id).innerHTML = badgeHTML();
  });
  [].forEach.call(document.querySelectorAll('.badge'), function(el){
    el.addEventListener('click', function(e){
      if (inIAB){
        var box = document.getElementById('iab');
        box.classList.add('armed');
        box.querySelector('.iab-body').textContent = T.iabBodyArmed;
      }
      if (!C.preferScheme) return;
      var deep = handoffUrl();
      if (!deep || deep === STORE.ios.url) return;
      e.preventDefault();
      var gone = false;
      function mark(){ gone = true; }
      document.addEventListener('visibilitychange', function(){ if (document.hidden) mark(); }, {once:true});
      window.addEventListener('pagehide', mark, {once:true});
      setTimeout(function(){ if (!gone) location.href = STORE.ios.url; }, 1600);
      location.href = deep;
    });
  });
}

function renderAll(){
  applyText();
  renderReviews(); renderWays(); renderSteps(); renderShowcase();
  renderFeatures(); renderPrivacy(); renderPlans(); renderFaq();
  renderBadges(); renderFooter();
}

/* footer links + copy */
function renderFooter(){
  var fl = [];
  if (C.links.privacy) fl.push('<a href="' + C.links.privacy + '">' + T.privacy + '</a>');
  if (C.links.terms)   fl.push('<a href="' + C.links.terms + '">' + T.terms + '</a>');
  if (C.social.email)  fl.push('<a href="mailto:' + C.social.email + '">' + C.social.email + '</a>');
  document.getElementById('foot-links').innerHTML = fl.join('');
  document.getElementById('copy').textContent = T.copy;
}

renderAll();

if (inIAB) document.getElementById('iab').hidden = false;

/* ══ scroll reveal ══════════════════════════════════════════════════
   The app's polish is motion, not gloss, so sections lift in as they arrive.
   Without IntersectionObserver everything is simply shown.

   The reveal hides content behind opacity:0, so it MUST NOT be the only thing
   standing between a visitor and the bottom CTA. A section parked in the
   bottom rootMargin band of a viewport that cannot scroll any further never
   intersects and would stay invisible for good — which is exactly where the
   "Start tracking today" badge sits. Hence the belt-and-braces sweep: whatever
   the observer has not revealed shortly after load gets shown outright. */
(function(){
  var els = [].slice.call(document.querySelectorAll('.reveal'));
  function showAll(){ els.forEach(function(el){ el.classList.add('in'); }); }
  if (!('IntersectionObserver' in window)){ showAll(); return; }

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  els.forEach(function(el){ io.observe(el); });

  /* Reaching the end of the document means there is nothing left to scroll
     into view, so anything still hidden never will be — show it. A blanket
     timer would work too, but it would also fire while the visitor is still
     near the top and rob every lower section of its entrance. */
  function atEnd(){
    return window.innerHeight + window.scrollY >=
           document.documentElement.scrollHeight - 2;
  }
  function sweep(){ if (atEnd()) showAll(); }
  window.addEventListener('scroll', sweep, { passive: true });
  window.addEventListener('resize', sweep);
  window.addEventListener('load', sweep);
  sweep();
})();

/* ══ auto hand-off ══════════════════════════════════════════════════
   iPhones arriving from a social link go to the store without waiting for a
   tap. Three rules keep this from backfiring:

   • Desktop never redirects — it would only show the store's web page.
   • Android never redirects either: there is no Android app, so the App Store
     would be a dead end. Those visitors just read the page.
   • Inside an in-app browser we attempt ONLY the break-out scheme. A plain
     https navigation would load the store page trapped in that same webview,
     which is worse than staying here, so on failure the page and its
     "Tap ••• → Open in browser" helper simply remain.

   The attempt is silent and harmless: an unhandled scheme does nothing. */
(function autoHandoff(){
  if (!C.autoRedirect) return;
  if (os !== 'ios') return;
  if (param('noredirect') === '1') return;          // escape hatch for testing
  var fromSocial = src !== 'direct';
  if (!inIAB && !fromSocial) return;                // organic visitors read the page

  setTimeout(function(){
    var target = inIAB ? handoffUrl() : STORE.ios.url;
    if (inIAB){
      var box = document.getElementById('iab');
      if (box){
        box.classList.add('armed');
        box.querySelector('.iab-body').textContent = T.iabBodyArmed;
      }
    }
    location.href = target;
  }, C.autoRedirectDelayMs || 700);
})();

/* ══ geo refinement ═════════════════════════════════════════════════
   Runs ONLY when the browser said plain English and the visitor hasn't pinned
   a language. Many phones in Uzbekistan are set to English while the user
   would rather read Uzbek or Russian — that's the case this covers.

   Deliberately not in the critical path: the page has already rendered from
   navigator.language. This just re-labels the text if the country disagrees.
   Same-origin, edge-served, and fails open on any error or timeout. */
(function refineByGeo(){
  if (pinned) return;                       // explicit choice wins, always
  if (browserLang !== 'en') return;         // browser was specific — trust it
  if (!window.fetch || !window.AbortController) return;

  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('spent_geo') || 'null'); } catch(e){}
  if (cached && cached.t && Date.now() - cached.t < 7 * 24 * 3600 * 1000) return apply(cached.c);

  var ctl = new AbortController();
  var timer = setTimeout(function(){ ctl.abort(); }, 1500);
  fetch('/api/geo', { signal: ctl.signal })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      clearTimeout(timer);
      if (!d || !d.country) return;
      try { localStorage.setItem('spent_geo', JSON.stringify({ c: d.country, t: Date.now() })); } catch(e){}
      apply(d.country);
    })
    .catch(function(){ clearTimeout(timer); });   // fail open — keep English

  function apply(country){
    var want = C.geo.uz.indexOf(country) !== -1 ? 'uz'
             : C.geo.ru.indexOf(country) !== -1 ? 'ru' : 'en';
    if (want === lang || !STR[want]) return;
    lang = want; T = STR[want];
    document.documentElement.lang = want;
    renderAll();
    var on = document.querySelector('.langs button.on');
    if (on) on.classList.remove('on');
    var next = document.querySelector('.langs button[data-l="' + want + '"]');
    if (next) next.classList.add('on');
  }
})();

/* ══ analytics ══════════════════════════════════════════════════════
   Cloudflare Web Analytics: cookieless, no consent banner needed, gives
   country + referrer breakdowns. Loaded last and async so it can never block
   or break the page — the site works fine with it blocked, or with no token
   configured at all. */
(function(){
  if (!CONFIG.cfBeaconToken) return;
  var s = document.createElement('script');
  s.type = 'module'; s.defer = true;
  s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
  s.setAttribute('data-cf-beacon', JSON.stringify({ token: CONFIG.cfBeaconToken }));
  document.body.appendChild(s);
})();

/* Preview hook: __preview('iab'|'web', 'ru', 'ios') */
window.__preview = function(s, l, o){
  location.replace(location.pathname + '?state=' + (s || (inIAB ? 'iab' : 'web')) +
                   '&lang=' + (l || lang) + '&os=' + (o || os) + '&noredirect=1');
};
</script>
